<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f8f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16171c" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="hitl" />
    <title>hitl — Human In The Loop</title>
    <link rel="icon" href="assets/icon.svg" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="assets/app.css" />
    <script>
      // the saved theme before anything draws, so a dark page never flashes white
      try {
        const t = localStorage.getItem('hitl:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body data-view="">
    <div class="progress" aria-hidden="true"></div>
    <div class="shell">
      <header class="bar" id="bar">
        <a class="brand" id="home" href="#/" title="Everything waiting on you (Human In The Loop)">
          <span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="3.2" /><path d="M5.5 20a6.5 6.5 0 0 1 13 0" /><path d="M19.5 4.5a9 9 0 0 1 0 6M4.5 4.5a9 9 0 0 0 0 6" /></svg></span><b>hitl</b><span class="count" id="inbox-count" hidden>0</span>
        </a>
        <button class="proj-pick" id="proj" type="button" hidden><span class="proj-mark" id="proj-mark"></span><span class="proj-label" id="proj-name"></span><span id="proj-caret"></span></button>
        <nav class="nav-tabs" id="tabs" aria-label="Sections">
          <a class="nav-tab" data-tab="inbox" id="tab-inbox"><span class="tab-ic"></span><span class="tab-label">Inbox</span><span class="count" id="proj-count" hidden>0</span></a>
          <a class="nav-tab" data-tab="files" id="tab-files"><span class="tab-ic"></span><span class="tab-label">Files</span></a>
          <a class="nav-tab" data-tab="changes" id="changes-btn"><span class="tab-ic"></span><span class="tab-label">Changes</span><span class="count" id="changes-count" hidden>0</span></a>
          <a class="nav-tab" data-tab="notes" id="review-btn"><span class="tab-ic"></span><span class="tab-label">Notes</span><span class="count warn" id="review-count" hidden>0</span></a>
          <a class="nav-tab" data-tab="decisions" id="tab-decisions"><span class="tab-ic"></span><span class="tab-label">Decisions</span></a>
        </nav>
        <span id="branch"></span>
        <form class="search" id="search-form" role="search">
          <span id="search-icon"></span>
          <input id="q" type="search" placeholder="Search in files" aria-label="Search in files" autocomplete="off" spellcheck="false" enterkeyhint="search" />
          <button type="button" class="chip" id="scope">everywhere</button>
        </form>
        <nav class="bar-acts">
          <button class="icon-btn" id="qo-btn" title="Go to a file (Ctrl+P)" aria-label="Go to a file"></button>
          <a class="icon-btn" id="notify-btn" href="#/notify" title="Notifications" aria-label="Notifications"></a>
          <a class="icon-btn" id="machine-btn" href="#/machine" title="This computer: CPU, memory and every Claude Code session" aria-label="This computer"></a>
          <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings"></button>
          <span class="live" id="live" title="Live: updates as things change"></span>
        </nav>
      </header>
      <div class="app page" id="app">
        <aside class="tree" aria-label="Folders"><ul class="roots" id="tree"></ul></aside>
        <div class="splitter-wrap"><div class="splitter" id="splitter" title="Drag to resize"></div></div>
        <section class="main" id="main" aria-live="polite"><div class="skeleton" style="height: 120px; margin: 24px"></div></section>
        <section class="file" id="file" aria-label="File" hidden></section>
      </div>
    </div>
    <script type="module" src="assets/main.js"></script>
  </body>
</html>
